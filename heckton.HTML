<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body{
            background:linear-gradient(rgb(14, 6, 43),rgb(236, 62, 178));
            min-height:100vh;
            display:flex;
            justify-content: center;
            align-items: center;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login{
  border:3px solid;
  width:250px;
  height:260px;
  padding:50px;
  background:linear-gradient(rgb(66, 6, 90),rgb(216, 231, 236));
  font-weight: bold;
  border-radius: 34px;
  box-shadow: 0 10px 40px rgba(165, 209, 45, 0.651);
  animation: fadein 0.3s ease-out;
        }
        @keyframes fadein{
            to{
                opacity: 0;
                transform: translateY(0);
            }
            from{
                opacity: 1;
                transform: translateY(20);
            }
        }
        .login input{
            border:none;
            border-radius: 8px;
            padding:10px 14px;
            width:100%;
            margin-top: 9px;
            margin-right:20px;
            margin-bottom:5px;
            background:rgb(209, 209, 203);
            font-size:0.8rem;
            color:rgb(0, 0, 0);
            font-weight: 100;

        }
        .login button{
            justify-content: center;
            border-radius:10px;
            cursor: pointer;
            width: 100%;
            padding:10px;
            margin-top:9px;
            margin-right: 5px;
            margin-bottom:17px;
            background:rgb(61, 107, 160);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 700;
            color:black;
            text-shadow: 0 0 10px 20px rgb(37, 7, 148);
            animation:fadein 0.4s ease-in;

        }
        @keyframes fadein{
            to{
                opacity: 0;
                transform:0;

            }
            from{
                opacity: 1;
                transform: 20;
            }
        }
        .login h2{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size:1.5rem;
            text-align: center;
            color:aliceblue;

                }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>
</head>
<body>
    <div class="login">
        <h2>LOGIN HERE</h2>
    <input type="text" placeholder="ENTER YOUR NAME">
    <input type="text" placeholder="ENTER YOUR GMAIL">
    <input type="password" placeholder="ENTER YOUR PASSWORD">
    <button>CONFIRM HERE!</button>
    </div>
</body>
</html>
